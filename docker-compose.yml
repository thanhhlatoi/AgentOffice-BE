services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentoffice
      POSTGRES_USER: agentoffice
      POSTGRES_PASSWORD: agentoffice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?cần khai báo trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?cần khai báo trong .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
  # LLM gateway (9Router): docker compose --profile gateway up -d. Dashboard http://localhost:20128, tạo combo + API key ở đó.
  9router:
    image: decolua/9router:latest
    profiles: ["gateway"]
    environment:
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-}   # không dùng :? để compose mặc định không đòi biến này
    ports:
      - "20128:20128"
    volumes:
      - ./9router-data:/app/data
volumes:
  pgdata:
  miniodata:
