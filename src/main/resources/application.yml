spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: agent-office-be
  datasource:
    url: jdbc:postgresql://localhost:5432/agentoffice
    username: agentoffice
    password: agentoffice
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

agentoffice:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:agent-office}
  cors-origins: http://localhost:5173
  llm:
    provider: ${LLM_PROVIDER:fake}   # fake | local (máy AI local chuẩn OpenAI: Ollama, LM Studio, vLLM...)
    local:
      base-url: ${LOCAL_LLM_URL:http://localhost:11434/v1}   # Ollama mặc định; gồm cả /v1
      api-key: ${LOCAL_LLM_API_KEY:}                         # Ollama không cần
      provider-name: ollama                                  # khớp model_price.provider để tính usage
      default-model: ${LOCAL_LLM_MODEL:qwen3:4b}             # dùng khi tên model của request không phải model thật
      model-aliases:                                         # tên model_profile -> model thật trên máy local
        local.small: ${LOCAL_LLM_MODEL:qwen3:4b}
        local.strong: ${LOCAL_LLM_MODEL:qwen3:32b}
        planner: ${LOCAL_LLM_MODEL:qwen3:4b}
      timeout: 300s
      reasoning-effort: ${LOCAL_LLM_REASONING_EFFORT:}       # none = tắt suy luận (qwen3.x...); trống = không gửi
  events:
    relay-interval-ms: 500
  secrets:
    master-key-base64: ""
  limits:
    max-task-depth: 3         # độ sâu giao việc tối đa (đã chốt)
    max-tasks-per-goal: 20    # số task tối đa mỗi goal (đã chốt)
  planner: hermes             # hermes | llm | fake
  hermes:                     # chỉ dùng khi planner=hermes; thiếu base-url thì app dừng lúc khởi động
    base-url: ${HERMES_URL:}
    api-key: ${HERMES_API_KEY:}
    model-check-url: ${HERMES_MODEL_CHECK_URL:}   # vd Ollama /api/tags, trống = bỏ qua
  hermes-admin:               # hermes_admin.py trên máy Hermes (quản lý bot/profile); trống = tắt, API trả 503
    url: ${HERMES_ADMIN_URL:}
    key: ${HERMES_ADMIN_KEY:}
    clone-from: ${HERMES_CLONE_FROM:}   # bot mẫu để sao chép khi tạo bot cho agent mới, trống = bot trống
    stall-timeout: 300s       # không có sự kiện trong khoảng này = kẹt, tự dừng run
  scheduler:
    enabled: true
    tick-ms: 1000
    max-concurrent-tasks: 4   # tổng số task chạy đồng thời; mỗi agent có thêm agent.max_concurrent_tasks (mặc định 1)
    backoff-seconds: 5,30,120
  approval:
    require-plan-approval: true   # false = tạo task ngay khi Planner trả kế hoạch hợp lệ
    ttl: 24h
    on-reject: FAIL_TASK          # FAIL_TASK | RETURN_TO_AGENT
    expiry-scan-ms: 60000
  runner:
    fake-delay-ms: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info     # mở rộng (metrics, loggers) chỉ ở profile dev, trên cổng riêng chỉ localhost
